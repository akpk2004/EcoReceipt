[project]
name = "ecoreceipt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anubhav Kaushik", email = "anubhavk2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.3.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "streamlit>=1.67.0",
]

[project.scripts]
